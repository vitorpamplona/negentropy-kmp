#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
# Silence "Native task '<target>Test' is disabled" warnings for targets that
# cannot run on the current CI host (e.g. iosX64/linuxX64/mingwX64 on macOS).
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.negentropy
POM_ARTIFACT_ID=kmp-negentropy
VERSION_NAME=1.2.1

# Magpie (Nostr + Blossom publishing, beside Maven Central). Releases go to the release key's own
# relays, the write relays of its NIP-65 list (kind 10002) and the ones
# vitorpamplona.com/.well-known/nostr.json lists for it, which is where every client looks for them.
# Index relays are only where that relay list is looked up. For more copies, add write relays to the
# key's kind 10002.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
